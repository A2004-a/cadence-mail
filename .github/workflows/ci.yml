name: Cadence CI & Desktop Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    name: Typecheck, Backend Suite & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Backend unit, security & automation tests
        run: npm test

      - name: Production build (server + client)
        run: npm run build

  e2e:
    name: Playwright Browser E2E
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Node dependencies & build
        run: |
          npm ci --legacy-peer-deps
          npm run build

      - name: Install Playwright & Chromium
        run: |
          python3 -m pip install --upgrade pip playwright
          python3 -m playwright install chromium --with-deps

      - name: Run Playwright E2E checks
        run: npm run test:e2e

  desktop-windows:
    name: Package Windows Desktop EXE
    runs-on: windows-latest
    needs: verify
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm

      - name: Install dependencies & build desktop binary
        run: |
          npm ci --legacy-peer-deps
          npm run build
          npm run build:exe

      - name: Upload Desktop Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cadence-windows-desktop
          path: |
            dist-exe/Cadence.exe
            dist-exe/.env.example
            dist-exe/README.txt
          retention-days: 30

      - name: Attach binary to GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-exe/Cadence.exe
            dist-exe/.env.example
            dist-exe/README.txt
